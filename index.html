<style>
:root{
  --bg:#050c31; --m9:#07153b; --m8:#0b1d57; --m7:#0c2663; --m6:#12337f;
  --gold:#f0cf7a; --gold2:#c99a2e; --cream:#fbf0da; --ink:#f7ead2; --mut:#c9b79a;
  --ok:#7fd6a0; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); min-height:100vh; line-height:1.45;
  background:
    radial-gradient(1200px 640px at 50% -10%, #12337f 0%, rgba(18,51,127,0) 62%),
    radial-gradient(900px 520px at 100% 100%, #0a1d55 0%, rgba(10,29,85,0) 60%),
    var(--bg);
  background-attachment:fixed;
}
body::before{ /* faint gold dust */
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, #f0cf7a 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 12%, #fff3cf 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 33% 64%, #f0cf7a 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 70%, #f0cf7a 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 55% 88%, #fff3cf 50%, transparent 51%),
    radial-gradient(1px 1px at 6% 82%, #f0cf7a 50%, transparent 51%);
  background-size:520px 520px;
}
.wrap{position:relative;max-width:1140px;margin:0 auto;padding:22px 16px 120px}

/* ───────── header ───────── */
header{text-align:center;margin-bottom:22px}
.eyebrow{display:inline-block;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(240,207,122,.35);padding:5px 12px;border-radius:99px;background:rgba(240,207,122,.07)}
h1{display:table;margin:4px auto 0;padding:.1em .18em .22em;font-size:clamp(2.4rem,8vw,3.9rem);line-height:1.55;font-weight:800;
  background:linear-gradient(180deg,#fff3cf 18%,#f0cf7a 52%,#b98621 86%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 14px rgba(240,180,60,.28))}
.sub{color:var(--mut);font-size:1rem;letter-spacing:.04em}
.tagline{font-family:Georgia,"Times New Roman",serif;font-style:italic;color:var(--gold);margin-top:-6px;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;font-size:.86rem;
  background:rgba(255,255,255,.06);border:1px solid rgba(240,207,122,.22)}
.pill.count{background:linear-gradient(135deg,rgba(240,207,122,.22),rgba(201,154,46,.12));border-color:rgba(240,207,122,.5);color:#fff3cf;font-weight:600}

/* ───────── layout ───────── */
.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){
  header{margin-bottom:16px}
  .grid{grid-template-columns:minmax(300px,500px) minmax(0,1fr);align-items:start;gap:34px}
  .stage{position:sticky;top:14px}
  .mobilebar{display:none!important}
  .wrap{padding-bottom:48px}
}

/* ───────── stage ───────── */
.stage-inner{position:relative;margin:0 auto;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(240,207,122,.35),0 18px 60px rgba(0,0,0,.55),0 0 80px rgba(201,154,46,.18);
  background:#0a1440}
.stage-inner canvas{display:block;width:100%;height:auto}
#sparkles{position:absolute;inset:0;pointer-events:none}
#dragpad{position:absolute;border-radius:14px;outline:none;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#dragpad.has-photo{cursor:grab}
#dragpad.dragging{cursor:grabbing}
#dragpad:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.stage-hint{margin-top:10px;text-align:center;color:var(--mut);font-size:.82rem}
.formats{display:flex;gap:6px;justify-content:center;margin:12px auto 0;flex-wrap:wrap}

/* ───────── panel cards ───────── */
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(240,207,122,.22);
  border-radius:var(--radius);padding:18px;backdrop-filter:blur(6px);transition:border-color .25s, box-shadow .25s}
.card.pulse{animation:pulse .9s ease 1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,207,122,0)}30%{box-shadow:0 0 0 5px rgba(240,207,122,.55)}}
.card h2{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin-bottom:12px;color:#fff3cf}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:.9rem;font-weight:700;
  color:#0a1440;background:linear-gradient(135deg,#f6dc8e,#c99a2e);flex:none;transition:background .25s}
.card.done .num{background:var(--ok)}
.card.done .num::before{content:"✓"}
.card.done .num span{display:none}
label.lbl{display:block;font-size:.8rem;color:var(--mut);margin:12px 0 6px;letter-spacing:.03em}
label.lbl:first-of-type{margin-top:0}

.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;border-radius:12px;padding:12px 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, filter .2s, background .2s;color:var(--ink)}
.btn{text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.sw:focus-visible,input:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{color:#0a1440;background:linear-gradient(135deg,#f9e29b 0%,#e0b447 55%,#c99a2e 100%);
  box-shadow:0 6px 22px rgba(224,180,71,.35);position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(240,207,122,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.big{width:100%;padding:15px;font-size:1.05rem;letter-spacing:.02em}
.btn[disabled]{opacity:.55;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:22px 14px;border-radius:14px;
  border:2px dashed rgba(240,207,122,.45);background:rgba(240,207,122,.06);cursor:pointer;transition:background .2s,border-color .2s}
.drop:hover,.drop.over{background:rgba(240,207,122,.14);border-color:var(--gold)}
.drop b{font-size:1rem;color:#fff3cf}
.drop small{color:var(--mut)}
.drop .ic{font-size:1.8rem}
#photoTools[hidden]{display:none}
.tools{display:grid;gap:12px}
.zoomrow{display:flex;align-items:center;gap:10px}
.zoomrow span{font-size:1.1rem;color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(240,207,122,.25);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f9e29b,#c99a2e);border:2px solid #0a1440;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#e0b447;border:2px solid #0a1440;cursor:pointer}
.iconbtns{display:flex;gap:8px;flex-wrap:wrap}
.iconbtns .btn{padding:9px 12px;font-size:.88rem;flex:0 0 auto}

.chip,.seg button{appearance:none;cursor:pointer;font:inherit;font-size:.86rem;padding:7px 13px;border-radius:99px;color:var(--ink);
  background:rgba(255,255,255,.06);border:1px solid rgba(240,207,122,.25);transition:all .15s}
.chip:hover,.seg button:hover{background:rgba(255,255,255,.12)}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:linear-gradient(135deg,#f6dc8e,#d4a63a);color:#0a1440;border-color:transparent;font-weight:700}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}

input[type=text],textarea{width:100%;font:inherit;color:#fff;background:rgba(2,6,30,.45);border:1px solid rgba(240,207,122,.35);
  border-radius:12px;padding:12px 14px;outline-offset:2px}
input[type=text]{font-size:1.05rem}
input[type=text]::placeholder{color:rgba(247,234,210,.4)}
textarea{min-height:128px;resize:vertical;font-size:.9rem;line-height:1.45}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:.78rem;color:var(--mut)}
.meta .warn{color:#ffb4a0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.55);cursor:pointer;position:relative;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold);transform:scale(1.06)}
.check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:.88rem;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px;accent-color:#e0b447}
.privacy{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.8rem;color:var(--mut)}
a.link{color:var(--gold)}
.reg{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reg p{font-size:.9rem;color:var(--mut);flex:1 1 200px}

footer{margin-top:30px;text-align:center;color:var(--mut);font-size:.78rem}
footer p+p{margin-top:4px;opacity:.8}

/* ───────── mobile bar, modal, toast ───────── */
.mobilebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,12,49,0),rgba(5,12,49,.94) 40%);}
.mobilebar .btn{width:100%;padding:14px}
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,7,28,.82);backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{width:min(100%,460px);max-height:100%;overflow:auto;background:linear-gradient(180deg,#14286f,#0a1440);border:1px solid rgba(240,207,122,.4);
  border-radius:20px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.6);text-align:center}
.modal h3{font-size:1.25rem;color:#fff3cf;margin-bottom:4px}
.modal p{color:var(--mut);font-size:.88rem;margin-bottom:12px}
.modal img{display:block;max-width:100%;max-height:52vh;margin:0 auto 14px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto}
.modal .row{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;
  background:#fff3cf;color:#0a1440;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);text-align:center;font-size:.92rem}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:960px){#toast{bottom:28px}}
@media(max-width:959px){#toast{bottom:auto;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px)}#toast.show{transform:translate(-50%,0)}}
.mini{position:fixed;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));width:62px;height:auto;z-index:25;border-radius:10px;
  border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.55);display:none;cursor:pointer;background:#0a1440}
.mini.show{display:block}
@media(min-width:960px){.mini{display:none!important}}
@media(max-width:600px){
  .wrap{padding-top:14px}
  header{margin-bottom:14px}
  .eyebrow{font-size:.6rem;letter-spacing:.12em;padding:4px 10px}
  h1{margin:2px auto 0}
  .chips{gap:6px;margin-top:10px}
  .pill{font-size:.78rem;padding:5px 10px}
  .card{padding:15px}
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pad{position:absolute;border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;z-index:2}
.pad:focus-visible{box-shadow:0 0 0 3px var(--gold)}
#nameEdit{position:absolute;z-index:3;background:transparent;border:0;outline:none;text-align:center;padding:0;margin:0;
  font-family:Georgia,"Times New Roman","Noto Serif",serif;font-weight:700;color:#14284b;caret-color:#14284b;
  -webkit-appearance:none;appearance:none;border-radius:0;width:100%}
details{margin-top:14px}
details summary{cursor:pointer;color:var(--gold);font-size:.9rem;padding:4px 0}
.cropmodal{width:min(100%,580px)}
.cropstage{display:grid;place-items:center;margin:8px auto 12px}
#cropCanvas{display:block;border-radius:10px;background:#000;touch-action:none;outline:none;max-width:100%}
#cropCanvas:focus-visible{box-shadow:0 0 0 3px var(--gold)}
.drop.small{padding:14px}

html.locked .wrap, html.locked .mobilebar, html.locked .mini{display:none!important}
#gate{display:none;position:fixed;inset:0;z-index:50;overflow:auto;padding:20px 16px;place-items:center}
html.locked #gate{display:grid}
.gate-card{width:min(100%,560px);margin:auto;text-align:center;padding:26px 22px 22px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(240,207,122,.35);
  box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 90px rgba(201,154,46,.14);backdrop-filter:blur(8px)}
.gate-brand{display:table;margin:10px auto 0;padding:.1em .18em .22em;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.55;font-weight:800;
  background:linear-gradient(180deg,#fff3cf 18%,#f0cf7a 52%,#b98621 86%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 14px rgba(240,180,60,.28))}
.gate-card h2{font-size:1.35rem;color:#fff3cf;margin:-4px 0 8px}
.gate-sub{color:var(--mut);font-size:.95rem;margin-bottom:16px}
.gate-sub b{color:var(--ink)}
.gate-drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 14px;border-radius:16px;border:2px dashed rgba(240,207,122,.5);
  background:rgba(240,207,122,.07);cursor:pointer;transition:background .2s,border-color .2s}
.gate-drop:hover,.gate-drop.over{background:rgba(240,207,122,.15);border-color:var(--gold)}
.gate-drop .ic{font-size:2rem}
.gate-drop b{font-size:1.05rem;color:#fff3cf}
.gate-drop small{color:var(--mut)}
.gate-drop:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#gateStatus{margin-top:16px;text-align:left;font-size:.92rem}
.bar{height:8px;border-radius:99px;background:rgba(240,207,122,.2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f6dc8e,#c99a2e);transition:width .25s}
#gateResult{margin-top:16px;text-align:left;font-size:.92rem}
.gate-reg{margin-top:18px;padding-top:16px;border-top:1px solid rgba(240,207,122,.22)}
.gate-reg p{font-size:.9rem;color:var(--mut);margin-bottom:10px}
.gate-reg p b{color:var(--ink)}
.gate-reg .btn{width:100%}
.gate-reg .gate-lost{margin:10px 0 0;font-size:.8rem}
.gate-ok{text-align:center}
.gate-ok .big{font-size:2.6rem;line-height:1.2}
.gate-ok p{color:var(--mut);margin:4px 0 12px}
.gate-fail h3{font-size:1.05rem;color:#ffd7cf;margin-bottom:6px}
.gate-fail p{color:var(--mut)}
.chk{list-style:none;margin:10px 0;display:grid;gap:6px}
.chk li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:.88rem}
.chk li.ok .m{color:var(--ok)}
.chk li.no .m{color:#ff9d8a}
.gate-priv{margin-top:16px;font-size:.8rem;color:var(--mut)}
.gate-help{text-align:left;margin-top:12px}
.gate-help p,.gate-help li{font-size:.86rem;color:var(--mut)}
.gate-help ul{margin:6px 0 0 18px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(240,207,122,.35);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.plan-line{font-size:.92rem;color:var(--ink);margin-bottom:12px;line-height:1.5}
.plan-alt{font-size:.78rem;color:var(--mut);margin-top:10px}
.plan .row .btn{flex:1 1 150px}
#glitter{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{z-index:1}
.seg{display:flex;gap:4px;padding:4px;margin:0 auto 12px;width:min(100%,500px);border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.seg button{flex:1;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:.92rem;padding:11px 8px;border-radius:99px;background:transparent;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.seg button[aria-selected="true"]{background:linear-gradient(180deg,#f6dc8e,#c99a2e);color:#1a1200;box-shadow:0 3px 14px rgba(201,154,46,.4)}
.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:380px){.seg button{font-size:.82rem;padding:10px 4px}}
.bgbox{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.tog{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;position:relative}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .trk{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);position:relative;flex:none;transition:background .2s}
.tog .trk::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s}
.tog input:checked+.trk{background:linear-gradient(180deg,#f6dc8e,#c99a2e);border-color:transparent}
.tog input:checked+.trk::after{transform:translateX(20px)}
.tog input:focus-visible+.trk{outline:3px solid var(--gold);outline-offset:2px}
.bgsw{display:flex;gap:12px;margin-top:12px;align-items:center}
.bgsw>span{font-size:.85rem;color:var(--mut);margin-right:2px}
.bgsw button{width:36px;flex:none;min-width:0;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
.bgsw button[aria-checked="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,207,122,.38)}
.bgmsg{font-size:.84rem;color:var(--mut);margin:10px 0 0;min-height:1.2em}
